stages:
  - images
  - build
  - release
variables:
  DEBIAN_FRONTEND: noninteractive
  # Bump to refresh installed dependencies and invalidate compiler caches.
  NALA_CI_IMAGE_VERSION: "2026-10-10-1"
  CACHE_COMPRESSION_FORMAT: tarzstd
  CACHE_COMPRESSION_LEVEL: fastest

ci-dependency-image:
  stage: images
  image:
    name: moby/buildkit:v0.27.1-rootless@sha256:5616ed4e78a3552f3575864c8ab585c882b892c4e93b6a7b6ac8afbc98bd2f7a
    entrypoint: [""]
  variables:
    FF_USE_ADVANCED_POD_SPEC_CONFIGURATION: "true"
  parallel:
    matrix:
      - CI_IMAGE_TARGET: [sid]
        RUNNER_ARCH: [amd64, arm64]
      - CI_IMAGE_TARGET: [ubuntu]
        RUNNER_ARCH: [amd64, arm64]
  tags:
    - "${RUNNER_ARCH}"
  script:
    - scripts/ci-image "$CI_IMAGE_TARGET"

.package-job:
  stage: build
  tags:
    - "${RUNNER_ARCH}"
  variables:
    RUNNER_ARCH: amd64
    NALA_CI_LOCALE_CHECK: "1"
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        NALA_CI_BUILD_MODE: lto
        NALA_CI_TEST_PROFILE: ""
        NALA_TARGET_CACHE_POLICY: pull
    - when: on_success
      variables:
        NALA_CI_BUILD_MODE: debug
        NALA_CI_TEST_PROFILE: release
        NALA_TARGET_CACHE_POLICY: pull-push

  before_script:
    - . scripts/ci-build-profile
    - rustc --version && cargo --version
    - python3 tests/ci-release-assets.py
    - python3 tests/ci-build-profile.py
    - python3 tests/ci-packaging.py
    - python3 tests/ci-images.py
    - rm -rf dist/debian
    - |
      build_package() {
        log=$1; shift
        if ! DEB_BUILD_OPTIONS=terse scripts/deb-build "$@" >"$log" 2>&1; then
          tail -n 200 "$log"
          return 1
        fi
        tail -n 40 "$log"
      }
  artifacts:
    name: "nala-${PACKAGE_TARGET}-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 1 week
    paths:
      - dist/debian/*
      - '*build.log'

debian-sid-package:
  extends: .package-job
  image: "$CI_REGISTRY_IMAGE/ci/sid-${RUNNER_ARCH}:$CI_PIPELINE_ID"
  variables:
    PACKAGE_TARGET: "sid-${RUNNER_ARCH}"
  parallel:
    matrix:
      - RUNNER_ARCH: [amd64, arm64]
  cache:
    key:
      prefix: "sid-${RUNNER_ARCH}-${NALA_CI_IMAGE_VERSION}-${NALA_CI_BUILD_MODE}"
      files:
        - Cargo.lock
        - debian/control
    policy: "$NALA_TARGET_CACHE_POLICY"
    paths:
      - target/
  script:
    - dpkg-checkbuilddeps
    - if test -n "${CI_COMMIT_TAG:-}"; then rm -rf target; fi
    - build_dir="$CI_PROJECT_DIR/dist/ci-build"
    - rm -rf "$build_dir"
    - mkdir -p "$build_dir"
    - trap 'rm -rf "$build_dir"' EXIT
    - |
      if ! build_package "$build_dir/source-build.log" --source --no-clean; then
        cp "$build_dir/source-build.log" source-build.log
        exit 1
      fi
      mv "$build_dir/source-build.log" source-build.log
    - dpkg-source -x dist/debian/*.dsc "$build_dir/nala"
    - if test -d target; then mv target "$build_dir/nala/target"; fi
    - (cd "$build_dir/nala" && build_package "$CI_PROJECT_DIR/build.log" --binary --no-clean --out-dir "$CI_PROJECT_DIR/dist/debian")
    - lintian dist/debian/*.changes
    - cd "$build_dir/nala"
    - chmod -R go-w tests/deb/packages
    - tests/deb/run debian/nala/usr/bin/nala
    - tests/deb/history/run debian/nala/usr/bin/nala
    - tests/deb/safety/run debian/nala/usr/bin/nala
    - tests/deb/term/run debian/nala/usr/bin/nala
    - tests/deb/release-info/run debian/nala/usr/bin/nala
    - cd "$CI_PROJECT_DIR"
    - mv "$build_dir/nala/target" target
    - scripts/ci-release-assets "$PACKAGE_TARGET"

ubuntu-24.04-upstream-package:
  extends: .package-job
  image: "$CI_REGISTRY_IMAGE/ci/ubuntu-${RUNNER_ARCH}:$CI_PIPELINE_ID"
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
    PACKAGE_TARGET: "ubuntu-24.04-${RUNNER_ARCH}"
  parallel:
    matrix:
      - RUNNER_ARCH: [amd64, arm64]
  cache:
    - key:
        prefix: "ubuntu-${RUNNER_ARCH}-${NALA_CI_IMAGE_VERSION}-registry"
        files:
          - Cargo.lock
      paths:
        - .cache/cargo/registry/
      policy: "$NALA_TARGET_CACHE_POLICY"
    - key:
        prefix: "ubuntu-${RUNNER_ARCH}-${NALA_CI_IMAGE_VERSION}-${NALA_CI_BUILD_MODE}"
        files:
          - Cargo.lock
          - Cargo.toml
      policy: "$NALA_TARGET_CACHE_POLICY"
      paths:
        - target/
  script:
    - dpkg-checkbuilddeps -Pupstream-cargo
    - if test -n "${CI_COMMIT_TAG:-}"; then rm -rf target "$CARGO_HOME/registry"; fi
    - rm -rf debian/cargo_home debian/cargo_registry debian/cargo_out_dir
    - build_package build.log --binary --no-clean --upstream-cargo
    - chmod -R go-w tests/deb/packages
    - tests/deb/run debian/nala/usr/bin/nala
    - dpkg -i ./dist/debian/nala_*.deb
    - nala --version
    - scripts/ci-release-assets "$PACKAGE_TARGET"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - amd64
  dependencies: []
  variables:
    RELEASE_ASSET_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/nala/${CI_COMMIT_TAG}/nala-${CI_COMMIT_TAG}'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - |
      awk '/^nala \(/ { if (entry++) exit; next } /^ -- / { exit } { print }' debian/changelog > release-notes.md
      cat >> release-notes.md <<'EOF'

      Downloads include Debian Sid and Ubuntu 24.04 packages, both for amd64 and arm64.
      Use the package built for your distribution; the Sid build requires libapt-pkg7.0.
      Complete Sid bundles include unsigned .dsc/source archives, .changes, .buildinfo, debug packages, and build logs.
      These CI downloads are unsigned; Debian archive uploads are signed separately by the maintainer.
      EOF
  release:
    name: 'Nala $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    description: './release-notes.md'
    assets:
      links:
        - name: 'Debian Sid — amd64 .deb'
          url: '${RELEASE_ASSET_URL}-sid-amd64.deb'
          link_type: package
        - name: 'Debian Sid — arm64 .deb'
          url: '${RELEASE_ASSET_URL}-sid-arm64.deb'
          link_type: package
        - name: 'Ubuntu 24.04 — amd64 .deb'
          url: '${RELEASE_ASSET_URL}-ubuntu-24.04-amd64.deb'
          link_type: package
        - name: 'Ubuntu 24.04 — arm64 .deb'
          url: '${RELEASE_ASSET_URL}-ubuntu-24.04-arm64.deb'
          link_type: package
        - name: 'Debian Sid — amd64 complete source/build bundle'
          url: '${RELEASE_ASSET_URL}-sid-amd64.tar.gz'
          link_type: package
        - name: 'Debian Sid — arm64 complete source/build bundle'
          url: '${RELEASE_ASSET_URL}-sid-arm64.tar.gz'
          link_type: package
        - name: 'Ubuntu 24.04 — amd64 complete build bundle'
          url: '${RELEASE_ASSET_URL}-ubuntu-24.04-amd64.tar.gz'
          link_type: package
        - name: 'Ubuntu 24.04 — arm64 complete build bundle'
          url: '${RELEASE_ASSET_URL}-ubuntu-24.04-arm64.tar.gz'
          link_type: package
