[package]
name = "nala"
version = "0.17.2"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://gitlab.com/volian/nala"
readme = "README.md"
description = "Commandline frontend for the APT package manager"
include = [
	"/src/**",
	"/locales/**",
	"/build.rs",
	"/nala.conf",
	"/README.md",
	"/LICENSE",
]

[dependencies]
rust-apt = { version = "0.11.3", features = ["serde"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
toml = "1.1.4"
regex = "1.13.1"
globset = "0.4.20"
serde_json = "1.0.151"
crossterm = "0.29.0"
sha2 = "0.11.0"
chrono = "0.4.45"
ar = "0.9.0"
fluent = "0.17.0"

# Minimum versions available in Debian Sid.
reqwest = { version = "0.13.4", features = ["json", "socks"] }
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = { version = "4.6.8", features = ["unstable-dynamic"] }
comfy-table = { version = "7.2.2", features = ["tty", "custom_styling"] }
indexmap = "2.14.0"
nix = { version = ">=0.30.1, <0.32", features = ["fs", "process", "term", "ioctl", "signal", "user"] }
async-compression = { version = "0.4.27", features = ["tokio", "gzip", "xz", "zstd"] }
mio = { version = "1.2.0", features = ["os-ext"] }
anyhow = "1.0.103"
tar = { version = "0.4.45", default-features = false }

[build-dependencies]
# Minimum versions available in Debian Sid.
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = { version = "4.6.8", features = ["unstable-dynamic"] }
clap_mangen = "0.3.0"

[profile.lto]
# A profile with various additional optimizations
inherits = "release"

# It isn't clear that lto makes anything faster yet
# But it does reduce the binary size. true = "fat", can also use "thin"
# This save a LOT of binary size.
lto = true
opt-level = "s"

# Can't really tell if this changes anything
# This seems useless, at least in terms of file size.
# codegen-units = 1

# This causes it to not work on some machines?
# Saves about 1MB at the time of writing.
# Probably not good enough for not having the trace.
# panic = "abort"
